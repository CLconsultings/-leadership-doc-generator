<title>Leadership-Link Deck Generator</title>
<style>
  /* ---- LLOD / Leadership-Link brand system (single committed look) ---- */
  :root{
    --navy:#0A1F44; --navy-2:#14315f; --ink:#10233F;
    --orange:#F2541B; --gold:#D4AF37; --lime:#A6CE39;
    --paper:#F5F7FA; --paper-2:#E4EAF3; --line:#D8DFEA;
    --muted:#6B7488; --muted-2:#8A96B0; --white:#FFFFFF;
    --rail:#0A1F44; --rail-line:#22345c; --rail-ink:#E7ECF5; --rail-mut:#9AA6BF;
    --font:Tahoma, Verdana, Geneva, "DejaVu Sans", sans-serif;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased}
  .app{display:grid; grid-template-columns:340px 1fr; grid-template-rows:auto 1fr;
    grid-template-areas:"top top" "rail main"; height:100vh}

  /* ---- top bar ---- */
  .top{grid-area:top; background:var(--navy); color:var(--white); display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:3px solid var(--orange)}
  .brandmark{display:flex; align-items:center; gap:9px; font-weight:bold}
  .top h1{font-size:15px; margin:0; font-weight:bold}
  .top .sub{color:var(--rail-mut); font-size:12px}
  .top .spacer{flex:1}
  .btn{font-family:var(--font); font-size:13px; font-weight:bold; border:0; border-radius:8px; padding:9px 15px; cursor:pointer}
  .btn-primary{background:var(--orange); color:#fff} .btn-primary:hover{background:#d8440f}
  .btn-ghost{background:transparent; color:var(--rail-ink); border:1px solid var(--rail-line)} .btn-ghost:hover{background:var(--navy-2)}
  .btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  /* ---- control rail ---- */
  .rail{grid-area:rail; background:var(--rail); color:var(--rail-ink); overflow-y:auto; padding:18px 16px 40px}
  .rail::-webkit-scrollbar{width:10px} .rail::-webkit-scrollbar-thumb{background:#20335a; border-radius:8px}
  .group{margin-bottom:20px}
  .glabel{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--rail-mut); margin:0 0 8px; font-weight:bold}
  .field{margin-bottom:12px}
  .field > label{display:block; font-size:11.5px; color:var(--rail-mut); margin-bottom:5px}
  select,input[type=text],textarea{width:100%; font-family:var(--font); font-size:13.5px; background:#0e2551; color:#fff; border:1px solid var(--rail-line); border-radius:8px; padding:9px 10px}
  textarea{resize:vertical; min-height:60px; line-height:1.4}
  select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%); background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
  .seg{display:flex; background:#0e2551; border:1px solid var(--rail-line); border-radius:8px; padding:3px; gap:3px}
  .seg button{flex:1; font-family:var(--font); font-size:12px; font-weight:bold; border:0; border-radius:6px; padding:8px 4px; background:transparent; color:var(--rail-mut); cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--orange); color:#fff}
  .items .itemrow{display:flex; align-items:center; gap:8px; margin-bottom:7px}
  .items .num{flex:0 0 22px; height:22px; border-radius:50%; background:var(--gold); color:var(--navy); font-size:11px; font-weight:bold; display:grid; place-items:center}
  .note{font-size:11.5px; color:var(--rail-mut); line-height:1.5; background:#0e2551; border-left:3px solid var(--gold); padding:8px 10px; border-radius:0 6px 6px 0; margin-top:6px}
  .note.warn{border-left-color:var(--orange)}
  details.spot{border:1px solid var(--rail-line); border-radius:8px; padding:0 10px; background:#0c214a}
  details.spot summary{cursor:pointer; padding:10px 2px; font-size:12px; font-weight:bold; color:var(--rail-ink)}
  details.spot[open]{padding-bottom:10px}

  /* ---- preview ---- */
  .main{grid-area:main; overflow-y:auto; padding:26px 30px 60px; background:radial-gradient(1200px 400px at 70% -10%, #eef2f8, var(--paper))}
  .mainhead{display:flex; align-items:baseline; gap:12px; margin:2px 0 18px}
  .mainhead .pk{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:bold}
  .mainhead .ct{font-size:12px; color:var(--muted-2)}
  .deck{display:flex; flex-direction:column; gap:22px; max-width:960px; margin:0 auto}

  /* ---- slide (16:9, scales with width via container units) ---- */
  .slide{width:100%; aspect-ratio:16/9; container-type:inline-size; border-radius:var(--radius); overflow:hidden; box-shadow:0 6px 22px rgba(10,31,68,.14); position:relative; background:var(--white)}
  .slide .pad{position:absolute; inset:0; padding:6.2cqw 7cqw; display:flex; flex-direction:column}
  .s-dark{background:var(--navy); color:#fff} .s-light{background:var(--white); color:var(--ink)}
  .eyebrow{font-size:1.9cqw; letter-spacing:.22em; text-transform:uppercase; font-weight:bold; margin:0 0 2.2cqw}
  .s-dark .eyebrow{color:var(--gold)} .s-light .eyebrow{color:var(--muted)}
  .rule{height:.5cqw; width:9cqw; background:var(--lime); border:0; margin:0 0 3cqw; border-radius:2px}
  .title{font-size:7.4cqw; font-weight:bold; line-height:1.04; margin:0; text-wrap:balance; letter-spacing:-.02em}
  .subtitle{font-size:2.7cqw; margin:2.4cqw 0 0; color:#cdd7ea}
  .big{font-size:5.1cqw; font-weight:bold; line-height:1.14; margin:0; text-wrap:balance; max-width:84%}
  .foot{margin-top:auto; display:flex; align-items:center; justify-content:space-between; font-size:1.5cqw}
  .foot .wm{font-weight:bold} .s-dark .foot{color:#9fb0d0} .s-light .foot{color:var(--muted)} .foot .pg{font-variant-numeric:tabular-nums}

  /* icon-in-circle motif */
  .ic{border-radius:50%; display:grid; place-items:center; flex:0 0 auto}
  .ic svg{fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; width:56%; height:56%}
  .s-light .ic{background:var(--paper); color:var(--navy); box-shadow:inset 0 0 0 .4cqw var(--paper-2)}
  .s-dark .ic{background:var(--navy-2); color:var(--gold)}
  .ic-xl{width:24cqw; height:24cqw} .ic-lg{width:15cqw; height:15cqw} .ic-md{width:8.6cqw; height:8.6cqw} .ic-sm{width:5.4cqw; height:5.4cqw}

  .h-head{font-size:5cqw; font-weight:bold; line-height:1.06; margin:0 0 1cqw; letter-spacing:-.01em; text-wrap:balance}
  .h-sub{font-size:2.3cqw; color:var(--muted); margin:0 0 3.4cqw}

  /* overview: icon cards */
  .ocards{display:grid; gap:2.2cqw; margin-top:.5cqw}
  .ocards.c4{grid-template-columns:1fr 1fr} .ocards.c6{grid-template-columns:1fr 1fr}
  .ocard{display:flex; align-items:center; gap:2.6cqw; background:var(--paper); border-radius:2cqw; padding:2.3cqw 2.8cqw}
  .ocard .ok{font-size:1.6cqw; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:bold; display:block; margin-bottom:.4cqw}
  .ocard .on{font-size:2.4cqw; font-weight:bold; color:var(--ink); line-height:1.14}
  .ocards.c6 .ocard{padding:1.9cqw 2.4cqw} .ocards.c6 .on{font-size:2.2cqw}

  /* mission / big idea with accent icon */
  .lead{display:flex; align-items:flex-start; gap:4cqw}
  .lead .txt{flex:1}

  /* ground rules */
  .grules{display:grid; grid-template-columns:1fr 1fr; gap:2.6cqw 4cqw; margin-top:.5cqw}
  .gr{display:flex; gap:2.2cqw; align-items:center}
  .gr b{font-size:2.5cqw; display:block; color:var(--ink)} .gr span{font-size:1.95cqw; color:var(--muted)}

  /* divider */
  .divwrap{display:flex; flex-direction:column; justify-content:center; height:100%}
  .divnum{font-size:17cqw; font-weight:bold; color:var(--gold); line-height:.9; letter-spacing:-.03em; margin-top:1cqw}
  .divtitle{font-size:5.2cqw; font-weight:bold; margin:.6cqw 0 0; text-wrap:balance; max-width:82%}

  /* content */
  .content{display:grid; grid-template-columns:24cqw 1fr; gap:5cqw; align-items:center; height:100%}
  .content .lbl{font-size:1.9cqw; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:bold; margin:0 0 1.4cqw}
  .content .pt{font-size:4.4cqw; font-weight:bold; line-height:1.1; margin:0; text-wrap:balance}
  .content .mid{font-size:2.9cqw; color:var(--muted); font-weight:bold; margin:1.4cqw 0 0}
  .content .sp{font-size:2.5cqw; color:var(--orange); font-weight:bold; margin:1.8cqw 0 0}

  /* commitment */
  .commit .card{margin-top:1.4cqw; background:var(--paper); border-radius:2cqw; padding:3.2cqw 3.4cqw; border-left:.8cqw solid var(--gold)}
  .commit .cl{font-size:2.1cqw; color:var(--muted); margin:0 0 .6cqw} .commit .cl.two{margin-top:2.2cqw}
  .commit .line{border-bottom:.3cqw solid var(--line); height:3cqw}

  /* thanks */
  .cta{font-size:6.4cqw; font-weight:bold; margin:0; color:#fff}
  .contact{display:flex; flex-direction:column; gap:.6cqw; font-size:2.4cqw; margin-top:1.8cqw}
  .contact .nm{font-weight:bold; font-size:2.9cqw} .contact span{color:#cdd7ea}

  @media (max-width:820px){ .app{grid-template-columns:1fr; grid-template-areas:"top" "rail" "main"; height:auto} }
  @media print{
    @page{size:landscape; margin:0}
    .top,.rail,.mainhead{display:none !important}
    .app{display:block; height:auto} .main{padding:0; background:#fff; overflow:visible}
    .deck{max-width:none; gap:0}
    .slide{border-radius:0; box-shadow:none; break-after:page; width:100vw; height:100vh; aspect-ratio:auto}
    .slide:last-child{break-after:auto}
  }
</style>

<div class="app">
  <header class="top">
    <div class="brandmark"><span id="wm-arc"></span><span id="wm-text">Leadership-Link</span></div>
    <div><h1>Deck Generator</h1><span class="sub">on-brand slides, premade — edit the fields, print to PDF</span></div>
    <div class="spacer"></div>
    <button class="btn btn-ghost" id="reset">Reset to defaults</button>
    <button class="btn btn-primary" id="print">Print / Save as PDF</button>
  </header>

  <aside class="rail">
    <div class="group">
      <p class="glabel">Program</p>
      <div class="field"><select id="program"></select></div>
      <div class="field"><label>Deck type — two presets per program</label>
        <div class="seg" id="variant">
          <button data-v="workshop" aria-pressed="true">Facilitation deck</button>
          <button data-v="briefing" aria-pressed="false">Executive briefing</button>
        </div></div>
      <div class="field"><label>Brand</label>
        <div class="seg" id="brand">
          <button data-b="ll" aria-pressed="true">Leadership-Link</button>
          <button data-b="llod" aria-pressed="false">LLOD (On-Demand)</button>
        </div></div>
      <div id="pnote"></div>
    </div>
    <div class="group">
      <p class="glabel">Customize</p>
      <div class="field"><label>Subtitle / client line</label><input type="text" id="subtitle"></div>
      <div class="field"><label>The Big Idea (one line)</label><textarea id="bigIdea"></textarea></div>
      <div class="field"><label id="itemsLabel">Sections</label><div class="items" id="items"></div></div>
    </div>
    <div class="group">
      <details class="spot">
        <summary>Spotlight content slide</summary>
        <div class="field" style="margin-top:10px"><label>Label</label><input type="text" id="spot-label"></div>
        <div class="field"><label>Headline</label><input type="text" id="spot-headline"></div>
        <div class="field"><label>Key point</label><input type="text" id="spot-point"></div>
        <div class="field"><label>Support line</label><input type="text" id="spot-support"></div>
      </details>
      <p class="note">Premade and included automatically: Mission, Ground Rules, and Thank You / contact. The facilitation deck adds them; the briefing stays lean.</p>
    </div>
  </aside>

  <main class="main">
    <div class="mainhead"><span class="pk" id="deckKind"></span><span class="ct" id="deckCount"></span></div>
    <div class="deck" id="deck"></div>
  </main>
</div>

<script>
"use strict";
const ARC='<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17 A11 11 0 0 1 17 3" fill="none" stroke="#F2541B" stroke-width="2.4" stroke-linecap="round"/><circle cx="17" cy="17" r="2.3" fill="#F2541B"/></svg>';

/* ---- inline SVG icon set (flat line, currentColor) ---- */
const ICONS={
  users:'<circle cx="9" cy="8" r="3.1"/><path d="M3.6 19c0-3 2.4-5 5.4-5s5.4 2 5.4 5"/><path d="M16 5.4a3 3 0 0 1 0 5.5"/><path d="M18.6 19c0-2.1-1-3.7-2.6-4.5"/>',
  compass:'<circle cx="12" cy="12" r="8.4"/><path d="M15.2 8.8 10.4 10.9 8.8 15.2 13.6 13.1z"/>',
  chat:'<path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3H6a2 2 0 0 1-2-2z"/>',
  broadcast:'<circle cx="12" cy="12" r="2"/><path d="M8.7 8.7a4.6 4.6 0 0 0 0 6.6M15.3 8.7a4.6 4.6 0 0 1 0 6.6M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"/>',
  shield:'<path d="M12 3.2l7 2.4v5.4c0 4.4-3 7.4-7 8.9-4-1.5-7-4.5-7-8.9V5.6z"/><path d="M9 11.8l2 2 4-4"/>',
  clipboard:'<rect x="6" y="4.6" width="12" height="15.8" rx="2"/><path d="M9 4.6V3.6h6v1"/><path d="M9 11.2l2 2 4-4.2"/>',
  workflow:'<circle cx="6" cy="7" r="2.1"/><circle cx="18" cy="7" r="2.1"/><circle cx="12" cy="17" r="2.1"/><path d="M8.1 7h7.8M7.9 8.6 10.6 15.2M16.1 8.6 13.4 15.2"/>',
  refresh:'<path d="M18.8 12a6.8 6.8 0 1 1-2-4.8"/><path d="M18.8 4.2v3.6h-3.6"/>',
  gears:'<circle cx="12" cy="12" r="3"/><path d="M12 4.4v2.4M12 17.2v2.4M4.4 12h2.4M17.2 12h2.4M6.5 6.5l1.7 1.7M15.8 15.8l1.7 1.7M17.5 6.5l-1.7 1.7M8.2 15.8l-1.7 1.7"/>',
  key:'<circle cx="8" cy="12" r="3.4"/><path d="M11.4 12H20M17 12v3M20 12v2.4"/>',
  growth:'<path d="M4 19h16"/><path d="M6 15l4-4 3 2 5-6"/><path d="M18 7h-3M18 7v3"/>',
  bulb:'<path d="M9 16.4a5 5 0 1 1 6 0c-.6.5-1 1.2-1 2h-4c0-.8-.4-1.5-1-2z"/><path d="M10 20.4h4"/>',
  flag:'<path d="M6 21V4"/><path d="M6 5h11l-2 3 2 3H6"/>',
  check:'<circle cx="12" cy="12" r="8.4"/><path d="M8.4 12.2l2.6 2.5 4.6-5"/>',
  clock:'<circle cx="12" cy="12" r="8.4"/><path d="M12 7.6V12l3 2"/>',
  book:'<path d="M5 4.6h11a2 2 0 0 1 2 2V20H7a2 2 0 0 1-2-2z"/><path d="M5 17.4h13"/><path d="M9 4.6V16"/>',
  layers:'<path d="M12 4 4 8.4 12 12.8l8-4.4z"/><path d="M4.4 12.6 12 16.8l7.6-4.2"/>',
  target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>'
};
function icon(n){return `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||ICONS.target}</svg>`;}
function ic(n,size){return `<span class="ic ${size}">${icon(n)}</span>`;}

const MISSION="We help teams of experts become expert teams.";
const GROUND=[["clock","Be present","phones down, fully here"],["chat","Participate","the room is the content"],["check","Real examples","use situations you actually face"],["flag","Leave with one move","pick one behavior to change"]];

const PROGRAMS={
  managers:{name:"Managers in Motion",kind:"Four-block manager training",unit:"Block",subtitle:"For a biotech client",
    bigIdea:"Managers don't create performance. They create the conditions where it happens.",
    items:["Know Yourself and Others","Motivate Your People and Manage the Work","Give Feedback That Drives Performance and Growth","Manage Up and Out"],
    icons:["users","compass","chat","broadcast"],
    spot:{label:"BLOCK 01",headline:"Read people, then adapt.",point:"Make the shift from expert to manager.",support:"DiSC-informed adaptation."}},
  teams:{name:"Teams in Motion",kind:"Team effectiveness workshop",unit:"Move",subtitle:"Manager workshop",
    bigIdea:"Great teams don't just cooperate. They coordinate.",
    items:["Clarify the work","Trust the people","Run the handoffs","Reset the rhythm"],
    icons:["clipboard","shield","workflow","refresh"],
    spot:{label:"MOVE 01",headline:"Clarity before the handoff.",point:"Goal, role, decision, signal.",support:"Ask before it gets messy."}},
  senior:{name:"Senior Leaders in Motion",kind:"Leading through complexity",unit:"Move",subtitle:"Executive session",
    bigIdea:"Leadership is not having the right answers. It is creating the environment where the best answers emerge.",
    items:["Create Direction","Create Alignment","Create Ownership","Create Growth"],
    icons:["compass","gears","key","growth"],
    spot:{label:"MOVE 01",headline:"Make the work clear.",point:"Direction before speed.",support:"Clarity is a leadership act."}},
  leaders:{name:"Leaders in Motion",kind:"Flagship leadership development",unit:"Module",subtitle:"Six-module program",
    bigIdea:"«State the Leaders in Motion Big Idea»",
    items:["«Module 1»","«Module 2»","«Module 3»","«Module 4»","«Module 5»","«Module 6»"],
    icons:["book","layers","users","chat","gears","growth"],
    spot:{label:"MODULE 01",headline:"«Module core idea»",point:"«Key point»",support:"«Supporting model»"},
    verify:"Leaders in Motion content is not yet verified here (six modules, layered models). Fields are placeholders — supply the approved curriculum before delivering."}
};

let S={};
function load(program){const p=PROGRAMS[program];
  S={program,variant:S.variant||"workshop",brand:S.brand||"ll",subtitle:p.subtitle,bigIdea:p.bigIdea,items:p.items.slice(),spot:Object.assign({},p.spot)};}

const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function wm(){return S.brand==="llod"?"Leadership-Link On-Demand":"Leadership-Link";}
function foot(pg,total){return `<div class="foot"><span class="wm">${wm()}&nbsp;&nbsp;|&nbsp;&nbsp;Eileen Habelow, PhD</span><span class="pg">${pg} / ${total}</span></div>`;}
const P=PROGRAMS;

function slTitle(i,n){const p=P[S.program];return `<div class="slide s-dark"><div class="pad">
  <p class="eyebrow">${esc(p.kind)}</p><hr class="rule"><h2 class="title">${esc(p.name)}</h2>
  <p class="subtitle">${esc(S.subtitle)}</p>${foot(i,n)}</div></div>`;}
function slMission(i,n){return `<div class="slide s-dark"><div class="pad"><div class="lead">
  ${ic("target","ic-lg")}<div class="txt"><p class="eyebrow">Our Mission</p><hr class="rule"><p class="big">${esc(MISSION)}</p></div></div>${foot(i,n)}</div></div>`;}
function slGround(i,n){return `<div class="slide s-light"><div class="pad">
  <h3 class="h-head">Ground rules</h3><p class="h-sub">How we work together today</p>
  <div class="grules">${GROUND.map(g=>`<div class="gr">${ic(g[0],"ic-sm")}<div><b>${esc(g[1])}</b><span>${esc(g[2])}</span></div></div>`).join("")}</div>${foot(i,n)}</div></div>`;}
function slBig(i,n){return `<div class="slide s-dark"><div class="pad"><div class="lead">
  ${ic("bulb","ic-lg")}<div class="txt"><p class="eyebrow">The Big Idea</p><hr class="rule"><p class="big">${esc(S.bigIdea)}</p></div></div>${foot(i,n)}</div></div>`;}
function slOverview(i,n,title){const p=P[S.program];const c=S.items.length>4?"c6":"c4";
  return `<div class="slide s-light"><div class="pad"><h3 class="h-head">${esc(title)}</h3>
  <p class="h-sub">The ${p.unit.toLowerCase()}s of ${esc(p.name)}</p>
  <div class="ocards ${c}">${S.items.map((t,k)=>`<div class="ocard">${ic(p.icons[k]||"target","ic-md")}
    <div><span class="ok">${esc(p.unit)} ${String(k+1).padStart(2,"0")}</span><span class="on">${esc(t)}</span></div></div>`).join("")}</div>${foot(i,n)}</div></div>`;}
function slDivider(i,n){const p=P[S.program];return `<div class="slide s-dark"><div class="pad"><div class="divwrap">
  ${ic(p.icons[0]||"target","ic-md")}<span class="divnum">01</span><p class="divtitle">${esc(S.items[0])}</p></div>${foot(i,n)}</div></div>`;}
function slContent(i,n){const p=P[S.program];return `<div class="slide s-light"><div class="pad"><div class="content">
  ${ic(p.icons[0]||"target","ic-xl")}<div><p class="lbl">${esc(S.spot.label)}</p><p class="pt">${esc(S.spot.headline)}</p>
  <p class="mid">${esc(S.spot.point)}</p><p class="sp">${esc(S.spot.support)}</p></div></div>${foot(i,n)}</div></div>`;}
function slCommit(i,n){return `<div class="slide s-light commit"><div class="pad">
  <div class="lead" style="align-items:center;gap:3cqw">${ic("flag","ic-md")}<div><h3 class="h-head" style="margin:0">Your commitment</h3><p class="h-sub" style="margin:.4cqw 0 0">Leave with a real plan</p></div></div>
  <div class="card"><p class="cl">The situation coming up:</p><div class="line"></div>
  <p class="cl two">What I'll do differently:</p><div class="line"></div></div>${foot(i,n)}</div></div>`;}
function slThanks(i,n){const dom=S.brand==="llod"?"leadershiplinkondemand.com":"leadershiplink.com";
  return `<div class="slide s-dark"><div class="pad"><p class="eyebrow">Connect</p><hr class="rule">
  <p class="cta">Let's talk.</p><div class="contact"><span class="nm">Dr. Eileen Habelow, PhD</span>
  <span>${wm()}</span><span>eileen@leadershiplink.com</span><span>${dom}</span></div>${foot(i,n)}</div></div>`;}

function plan(){
  if(S.variant==="briefing")
    return [slTitle, slBig, (i,n)=>slOverview(i,n,"What we cover"), slContent, slThanks];
  return [slTitle, slMission, slGround, slBig, (i,n)=>slOverview(i,n,"Overview"), slDivider, slContent, slCommit, slThanks];
}
function render(){const p=P[S.program];
  document.getElementById("deckKind").textContent=p.name+" — "+(S.variant==="briefing"?"Executive briefing":"Facilitation deck");
  const b=plan();const n=b.length;
  document.getElementById("deckCount").textContent=n+" slides";
  document.getElementById("deck").innerHTML=b.map((f,idx)=>f(idx+1,n)).join("");
  document.getElementById("wm-text").textContent=wm();
}

/* ---- form ---- */
function buildItems(){const box=document.getElementById("items");box.innerHTML="";
  document.getElementById("itemsLabel").textContent=P[S.program].unit+"s";
  S.items.forEach((t,k)=>{const row=document.createElement("div");row.className="itemrow";
    row.innerHTML=`<span class="num">${k+1}</span>`;
    const inp=document.createElement("input");inp.type="text";inp.value=t;
    inp.addEventListener("input",()=>{S.items[k]=inp.value;render();});
    row.appendChild(inp);box.appendChild(row);});}
function syncFields(){
  document.getElementById("subtitle").value=S.subtitle;
  document.getElementById("bigIdea").value=S.bigIdea;
  document.getElementById("spot-label").value=S.spot.label;
  document.getElementById("spot-headline").value=S.spot.headline;
  document.getElementById("spot-point").value=S.spot.point;
  document.getElementById("spot-support").value=S.spot.support;
  document.getElementById("pnote").innerHTML=P[S.program].verify?`<div class="note warn">${P[S.program].verify}</div>`:"";}
function bindText(id,key){document.getElementById(id).addEventListener("input",e=>{S[key]=e.target.value;render();});}
function bindSpot(id,key){document.getElementById(id).addEventListener("input",e=>{S.spot[key]=e.target.value;render();});}
function selectProgram(prog){const v=S.variant,b=S.brand;load(prog);S.variant=v;S.brand=b;buildItems();syncFields();render();}

function init(){
  document.getElementById("wm-arc").innerHTML=ARC;
  const sel=document.getElementById("program");
  Object.entries(PROGRAMS).forEach(([k,v])=>{const o=document.createElement("option");o.value=k;o.textContent=v.name;sel.appendChild(o);});
  S.variant="workshop";S.brand="ll";load("managers");buildItems();syncFields();render();
  sel.addEventListener("change",e=>selectProgram(e.target.value));
  bindText("subtitle","subtitle");bindText("bigIdea","bigIdea");
  bindSpot("spot-label","label");bindSpot("spot-headline","headline");bindSpot("spot-point","point");bindSpot("spot-support","support");
  document.querySelectorAll("#variant button").forEach(btn=>btn.addEventListener("click",()=>{
    document.querySelectorAll("#variant button").forEach(b=>b.setAttribute("aria-pressed","false"));
    btn.setAttribute("aria-pressed","true");S.variant=btn.dataset.v;render();}));
  document.querySelectorAll("#brand button").forEach(btn=>btn.addEventListener("click",()=>{
    document.querySelectorAll("#brand button").forEach(b=>b.setAttribute("aria-pressed","false"));
    btn.setAttribute("aria-pressed","true");S.brand=btn.dataset.b;render();}));
  document.getElementById("reset").addEventListener("click",()=>selectProgram(S.program));
  document.getElementById("print").addEventListener("click",()=>window.print());
}
init();
</script>
